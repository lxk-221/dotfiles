# ~/.config/tmux/xukun.conf — 「xukun」个人模板(破坏性 set/unset 区)
#
# 只放会改变/覆盖 tmux 默认行为的设置;plain.conf 是本文件的逆操作(还原默认),
# 两者条目需一一对应维护。纯增量的按键都在 ~/.tmux.conf 通用区。

# prefix: C-b → C-a
unbind C-b
set -g prefix 'C-a'

# 窗口切换:释放默认 n/p,改用通用区的 C-n/C-p
unbind n
unbind p

# set default shell to zsh (/bin/zsh: macOS native path; on merged-/usr
# Linux distros /bin is a symlink to /usr/bin, so this works everywhere)
# 同事可能用 bash,故仅在个人模板生效
set-option -g default-shell /bin/zsh

# renumber windows name after close one of the windows
set-option -g renumber-windows on

# copy-mode 用 vi 键位(v/y/r 三个选择键与 mode-keys vi 配套,故放个人模板;
# plain 模板下 mode-keys 还原为默认 emacs,这些键不会被触发)
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
# y: copy selection to the system clipboard; runtime picks Mac/X11/Wayland tool (pbcopy/xsel/wl-copy)
bind-key -T copy-mode-vi y send-keys -X copy-pipe-no-clear "pbcopy 2>/dev/null || xsel --clipboard --input 2>/dev/null || wl-copy 2>/dev/null"
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

# 鼠标支持(改变滚轮/选取行为,对同事有影响)
set -g mouse on

# 开启 pane 编号显示（内部）
set -g pane-border-format "P#{pane_index}"
# 显示 pane 边框（确保编号能显示）
set -g pane-border-status top
