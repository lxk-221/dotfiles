# ~/.config/tmux/plain.conf — 「plain」协作模板
#
# xukun.conf 的逆操作:还原 tmux 全部默认行为(原 prefix C-b、默认 n/p 切窗口、
# emacs copy-mode、无鼠标、无 pane 边框编号、登录 shell)。
# ~/.tmux.conf 通用区的增量按键(方向键分屏、M-o 新窗口、hjkl 移动窗格等)全部保留。
#
# 还原一律用显式默认值而非 `set -gu`(unset 在全新 server 上全局选项从未设置过,
# 是无意义的操作);default-shell 例外见文末(分平台:Linux 写死 bash,macOS unset)。

# prefix 还原为默认 C-b(xukun 的 C-a 释放,C-b 重新绑定 send-prefix)
unbind C-a
set -g prefix C-b
bind C-b send-prefix

# 还原默认窗口切换键(xukun 释放了 n/p)
bind n next-window
bind p previous-window

# 还原全局选项为 tmux 默认值
set -g renumber-windows off
setw -g mode-keys emacs
set -g mouse off
set -g pane-border-status off
setw -g pane-border-format " #P "

# default-shell:分平台处理。
# - Linux 共享服务器:显式写死 /bin/bash。plain 的目标是"同事看到配置前的状态",
#   而平台网关对交互会话强制 bash(直连即 bash)。tmux 的动态解析链在此类平台
#   不可靠,有三层风险:① server 启动时的 SHELL 环境快照可能落在 /bin/sh(实测
#   出现过窗格全是 dash 的 server);② passwd 回退链会被本仓库 run_once 的 chsh
#   改成 zsh,同事拿到 zsh;③ 平台把 /bin/sh 替换为 sh-wrap 包装器(最终 exec
#   dash)。写死 bash 使 plain 窗格确定性等于直连体验,免疫全部三层。
# - macOS:个人机器无协作场景,unset 回落本机登录 shell(zsh)。
if-shell '[ "$(uname -s)" = Darwin ]' \
    'set -gu default-shell' \
    'set -g default-shell /bin/bash'
